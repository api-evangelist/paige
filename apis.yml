aid: paige
name: Paige
description: 'Paige (Paige AI, Inc.) is a New York City computational-pathology company
  founded in 2017 out of Memorial Sloan Kettering, and the first company to receive
  FDA authorization for a clinical AI application in digital pathology (Paige Prostate,
  De Novo 2021) alongside the FDA-cleared FullFocus whole-slide-image viewer. Its product
  line spans the Paige Platform, the Alba pathology copilot, OmniScreen, the AppLab
  third-party AI marketplace, and the openly published Virchow / Virchow2 / PRISM foundation-model
  family. Paige markets "UnifAI" — an SDK plus a set of APIs for vendor-neutral integration
  into laboratory workflows — but that developer surface is sold to laboratory customers
  rather than published: the developer docs host docs.paige.ai no longer resolves for
  the public. What Paige does publish openly is its research stack: the Paige-AI GitHub
  organization (paige-ml-sdk, philips-isyntax-rs, cdh1-cancer-res, omniscreen-eval-results)
  and the paige-ai Hugging Face organization carrying the Virchow and PRISM model weights.
  Paige was acquired by Tempus AI in September 2025.'
